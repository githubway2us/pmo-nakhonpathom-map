/* ============================================================

 * สิทธิ์แก้ไข: admin แก้ทุกเคส / เจ้าของแก้เคสตัวเอง / คนอื่นแก้ไม่ได้
 * Auto-Detect ตำบล: server API + fallback คำนวณ GeoJSON ในเบราว์เซอร์
 * ============================================================ */
const $=s=>document.querySelector(s);
const TYPES={'ผู้ป่วยติดเตียง':{c:'#e5484d',i:'🛏️'},'ผู้พิการ':{c:'#7c5cff',i:'♿'},
  'เด็ก':{c:'#f0a500',i:'🧒'},'ผู้ยากไร้':{c:'#0f8f74',i:'🏠'},
  'ผู้สูงอายุ':{c:'#2b7ef0',i:'👴'},'อื่นๆ':{c:'#6b7a90',i:'📍'}};

let me=null, map, cluster, markers={}, picked=null, pickMarker=null, myLoc=null;
let ADMIN={}, boundary=null, filt={amphoe:'',tambon:''}, _t;
const PK=['ADM3_TH','tam_th','TAM_NAMT','tb_th','tambon','name'];
const AK=['ADM2_TH','amp_th','AMP_NAMT','ap_th','amphoe'];

/* ★ NEW: state โหมดแก้ไข + auto-detect */
let editId=null, removedPhotoIds=[], existingPhotos=[], areaTouched=false, gpsArea=null, _gpsT=0;

const toast=(t,k='ok')=>{const e=$('#toast');e.textContent=t;e.className='toast show '+k;
  setTimeout(()=>e.className='toast '+k,3200)};
const open=id=>$(id).classList.add('show');
const close=id=>$(id).classList.remove('show');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const label=s=>s==='approved'?'อนุมัติแล้ว':s==='pending'?'รออนุมัติ':'ไม่อนุมัติ';
const areaTxt=p=>p.tambon?'อ.'+esc(p.amphoe||'-')+' ต.'+esc(p.tambon)+(p.moo?' หมู่ '+esc(p.moo):''):'ไม่ระบุตำบล';
const fillAmp=(s,ph)=>s.innerHTML='<option value="">'+ph+'</option>'+Object.keys(ADMIN).map(a=>'<option>'+a+'</option>').join('');
const fillTam=(s,a,ph)=>s.innerHTML='<option value="">'+ph+'</option>'+(ADMIN[a]||[]).map(t=>'<option>'+t+'</option>').join('');
const canEditPoint=p=>me.role==='admin'||p.reporterId===me.id;   // ★ สิทธิ์แก้ไข
document.querySelectorAll('.sheet').forEach(s=>s.onclick=e=>{if(e.target===s)s.classList.remove('show')});

/* ============================================================
 * ★ GEO DETECT v2 — ทำงานแม้ /api/geo/locate พัง
 * 1) ลอง server ก่อน (ได้หมู่บ้านด้วยถ้ามี)
 * 2) fallback: ray-casting จาก GeoJSON ขอบเขตที่โหลดไว้
 * ============================================================ */
const stripPrefix=s=>String(s==null?'':s).replace(/^(ตำบล|ต\.|อำเภอ|อ\.)\s*/,'').trim();
const pick=(pr,ks)=>{const k=ks.find(x=>pr&&pr[x]!=null&&pr[x]!=='');return k?String(pr[k]):''};

let rawGJ=null, GJ_INDEX=null;
function buildGJIndex(){
  if(GJ_INDEX||!rawGJ||!rawGJ.features) return;
  GJ_INDEX=[];
  for(const f of rawGJ.features){
    if(!f.geometry) continue;
    let minX=999,minY=999,maxX=-999,maxY=-999;
    (function walk(c){
      if(typeof c[0]==='number'){
        if(c[0]<minX)minX=c[0]; if(c[0]>maxX)maxX=c[0];
        if(c[1]<minY)minY=c[1]; if(c[1]>maxY)maxY=c[1];
      } else c.forEach(walk);
    })(f.geometry.coordinates);
    GJ_INDEX.push({f,bbox:[minX,minY,maxX,maxY]});
  }
}
function pointInRing(lat,lng,ring){
  let inside=false;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
    const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];
    if(((yi>lat)!==(yj>lat))&&(lng<(xj-xi)*(lat-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function pointInGeom(lat,lng,geom){
  const polys=geom.type==='Polygon'?[geom.coordinates]
    :geom.type==='MultiPolygon'?geom.coordinates:[];
  return polys.some(poly=>pointInRing(lat,lng,poly[0])
    &&poly.slice(1).every(h=>!pointInRing(lat,lng,h)));
}
function lookupLocal(lat,lng){
  buildGJIndex(); if(!GJ_INDEX) return null;
  for(const {f,bbox} of GJ_INDEX){
    if(lng<bbox[0]||lng>bbox[2]||lat<bbox[1]||lat>bbox[3]) continue;
    if(!pointInGeom(lat,lng,f.geometry)) continue;
    const pr=f.properties||{};
    return {tambon:stripPrefix(pick(pr,PK)),amphoe:stripPrefix(pick(pr,AK)),moo:pr.moo||''};
  }
  return null;
}
async function locate(lat,lng){
  try{
    const r=await fetch('/api/geo/locate?lat='+lat+'&lng='+lng);
    if(r.ok){
      const j=await r.json();
      if(j&&(j.tambon||j.amphoe))
        return {amphoe:stripPrefix(j.amphoe),tambon:stripPrefix(j.tambon),
                moo:j.moo||'',inProvince:j.inProvince};
    } else console.warn('[geo] /api/geo/locate → HTTP',r.status);
  }catch(e){console.warn('[geo] locate server error:',e)}
  const local=lookupLocal(lat,lng);
  if(!local) console.warn('[geo] หาเขตไม่เจอ @',lat,lng,'(อาจอยู่นอกจ.นครปฐม หรือขอบเขตยังโหลดไม่เสร็จ)');
  return local;
}
function matchKey(dict,name){
  if(!name) return '';
  if(dict[name]!=null) return name;
  const k=Object.keys(dict).find(k=>k.includes(name)||name.includes(k));
  if(!k) console.warn('[geo] ชื่อไม่ตรง dropdown:',name,'| มี:',Object.keys(dict));
  return k||'';
}

/* ---------- Bootstrap ---------- */
(async()=>{
  const r=await fetch('/api/me'); if(!r.ok) return location.href='/';
  me=await r.json(); if(me.status!=='approved') return location.href='/';
  const fallback='https://api.dicebear.com/7.x/initials/svg?seed='+encodeURIComponent(me.nickname||me.firstName||'U');

  initMap(); initGeo(); loadPoints(); initSocket();

/* ============================================================
 * MAP
 * ============================================================ */
function initMap(){
  map=L.map('map',{zoomControl:false}).setView([13.8199,100.0621],12);
  L.control.zoom({position:'bottomleft'}).addTo(map);
  const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19,crossOrigin:true,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'});
  const topo=L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{
    maxZoom:17,subdomains:'abc',crossOrigin:true,
    attribution:'&copy; OpenStreetMap, SRTM | &copy; OpenTopoMap'});
  const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{
    maxZoom:19,crossOrigin:true,
    attribution:'Tiles &copy; Esri, Maxar, Earthstar Geographics'});
  osm.addTo(map);
  window.layersCtl=L.control.layers(
    {'แผนที่ถนน':osm,'ภาพถ่ายดาวเทียม':sat,'ภูมิประเทศ':topo},
    null,{position:'topright',collapsed:true}).addTo(map);
  osm.on('tileerror',()=>{
    if(window._tileWarned) return;
    window._tileWarned=true;
    toast('โหลดแผนที่ไม่สำเร็จ — ตรวจสอบการเชื่อมต่ออินเทอร์เน็ต','err');
  });
  cluster=L.markerClusterGroup({maxClusterRadius:45}).addTo(map);

  map.on('click',e=>setPick(e.latlng.lat,e.latlng.lng));
  map.on('contextmenu',e=>setPick(e.latlng.lat,e.latlng.lng));

  if(navigator.geolocation) navigator.geolocation.watchPosition(p=>{
    window._acc=Math.round(p.coords.accuracy);
    myLoc=[p.coords.latitude,p.coords.longitude];
    if(!window._meM){
      window._meM=L.circleMarker(myLoc,{radius:8,color:'#fff',weight:3,
        fillColor:'#2b7ef0',fillOpacity:1}).addTo(map).bindTooltip('คุณอยู่ที่นี่');
      map.setView(myLoc,16);
    } else window._meM.setLatLng(myLoc);
    gpsAreaCheck(myLoc[0],myLoc[1]);        // ★ เดินข้ามตำบล → chip เปลี่ยนอัตโนมัติ
  },()=>toast('เปิดการเข้าถึงตำแหน่งเพื่อใช้งานได้เต็มที่','err'),{enableHighAccuracy:true});
}

/* ============================================================
 * GEO INIT — dropdown + เส้นเขต + สร้าง dropdown เองถ้า API พัง
 * ============================================================ */
async function initGeo(){
  try{const j=await (await fetch('/api/geo/admin')).json();ADMIN=j.amphoes||j}
  catch(e){console.warn('[geo] /api/geo/admin fail:',e)}
  fillAmp($('#fAmp'),'ทุกอำเภอ'); fillAmp($('#selAmp'),'— อำเภอ —');
  fillTam($('#fTam'),'','ทุกตำบล'); fillTam($('#selTam'),'','— ตำบล —');
  try{
    const r=await fetch('/api/geo/boundaries'); if(!r.ok) throw new Error('HTTP '+r.status);
    rawGJ=await r.json();                                   // ★ เก็บดิบไว้ใช้ fallback
    const AC={'เมืองนครปฐม':'#e5484d','กำแพงแสน':'#2b7ef0','ดอนตูม':'#7c5cff','นครชัยศรี':'#f0a500',
      'บางเลน':'#0f8f74','พุทธมณฑล':'#d6409f','สามพราน':'#0b7285'};
    const col=f=>AC[stripPrefix(pick(f.properties||{},AK))]||'#6b7a90';
    boundary=L.geoJSON(rawGJ,{
      style:f=>({color:col(f),weight:2,opacity:.9,dashArray:'7 6',lineCap:'round',fillColor:col(f),fillOpacity:.05}),
      onEachFeature:(f,l)=>{
        const pr=f.properties||{},t=stripPrefix(pick(pr,PK)),a=stripPrefix(pick(pr,AK));
        l.bindTooltip(t?('ต.'+t+(a?' อ.'+a:'')):'',{sticky:true});
        l.on('mouseover',()=>l.setStyle({weight:3.5,fillOpacity:.16}));
        l.on('mouseout',()=>boundary.resetStyle(l));
      }
    }).addTo(map);
    boundary.bringToBack();
    if(window.layersCtl) layersCtl.addOverlay(boundary,'เส้นปะเขตตำบล');
  }catch(e){console.warn('[geo] boundaries fail:',e)}
  /* ★ /api/geo/admin พัง? → สร้างรายการอำเภอ/ตำบลจาก GeoJSON เอง */
  if(!Object.keys(ADMIN).length&&rawGJ&&rawGJ.features){
    ADMIN={};
    rawGJ.features.forEach(f=>{
      const pr=f.properties||{};
      const a=stripPrefix(pick(pr,AK)),t=stripPrefix(pick(pr,PK));
      if(a&&t){(ADMIN[a]=ADMIN[a]||[]);if(!ADMIN[a].includes(t))ADMIN[a].push(t);}
    });
    fillAmp($('#fAmp'),'ทุกอำเภอ'); fillAmp($('#selAmp'),'— อำเภอ —');
    fillTam($('#fTam'),'','ทุกตำบล'); fillTam($('#selTam'),'','— ตำบล —');
    console.log('[geo] สร้าง dropdown จาก GeoJSON:',Object.keys(ADMIN));
  }
  map.on('moveend',updateAreaChip); updateAreaChip();
}

/* ★ GPS → ตำบล (throttle 20 วิ) — แสดง chip + อัปเดตฟอร์มถ้าเปิดอยู่ */
function gpsAreaCheck(lat,lng){
  const now=Date.now(); if(now-_gpsT<20000) return; _gpsT=now;
  locate(lat,lng).then(a=>{
    gpsArea=(a&&a.tambon)?a:null;
    if(gpsArea){
      $('#chipArea').textContent='🗺️ ต.'+gpsArea.tambon+' อ.'+gpsArea.amphoe+(gpsArea.moo?' หมู่'+gpsArea.moo:'');
      if($('#sheetPoint').classList.contains('show')&&!areaTouched&&!picked) applyArea(gpsArea,true);
    }
  });
}
function updateAreaChip(){clearTimeout(_t);_t=setTimeout(async()=>{
  if(gpsArea){$('#chipArea').textContent='🗺️ ต.'+gpsArea.tambon+' อ.'+gpsArea.amphoe;return;}
  const c=map.getCenter(),a=await locate(c.lat,c.lng);
  $('#chipArea').textContent=a&&a.tambon?'🗺️ อ.'+a.amphoe+' ต.'+a.tambon:'🗺️ ตำบล: —';},400)}

async function detectArea(){if(picked) applyArea(await locate(picked[0],picked[1]),true)}

/* ★ applyArea: force=ลากหมุด/เปิดฟอร์ม → เติมทับเสมอ / ไม่ force → ไม่ทับถ้า user เลือกเอง */
function applyArea(a,force){
  const note=$('#areaNote');
  if(a&&a.inProvince===false){note.textContent='⚠️ พิกัดอยู่นอกจังหวัดนครปฐม';return;}
  if(!a||(!a.tambon&&!a.amphoe)){
    note.textContent='⚠️ ตรวจเขตไม่สำเร็จ — พิกัดอาจอยู่นอกพื้นที่ในระบบ หรือขอบเขตยังโหลดไม่เสร็จ';return;}
  if(!force&&areaTouched){
    note.textContent='📍 GPS ตรวจพบ: อ.'+(a.amphoe||'?')+' ต.'+(a.tambon||'?')+' (คุณเลือกเองไว้แล้ว)';return;}
  const ampKey=matchKey(ADMIN,a.amphoe);
  $('#selAmp').value=ampKey;
  fillTam($('#selTam'),ampKey,'— ตำบล —');
  const tams=ADMIN[ampKey]||[];
  $('#selTam').value=tams.includes(a.tambon)?a.tambon:'';
  note.textContent='✅ ตรวจจากพิกัดอัตโนมัติ: อ.'+(a.amphoe||'-')+' ต.'+(a.tambon||'-')+(a.moo?' หมู่ '+a.moo:'')
    +($('#selTam').value?'':' — ⚠️ ชื่อตำบลไม่ตรงรายการ โปรดเลือกเอง');
}

/* ★ user เลือกเอง = ตั้งสถานะ touched → GPS จะไม่ทับ */
 $('#selAmp').onchange=e=>{fillTam($('#selTam'),e.target.value,'— ตำบล —');areaTouched=true};
 $('#selTam').onchange=()=>areaTouched=true;
 $('#fAmp').onchange=e=>{filt.amphoe=e.target.value;filt.tambon='';fillTam($('#fTam'),filt.amphoe,'ทุกตำบล');loadPoints(true)};

/* ============================================================
 * PICK / หมุดเลือกจุด — ซิงค์ hidden lat/lng ทุกครั้ง (★ แก้บั๊กสำคัญ)
 * ============================================================ */
function setPick(lat,lng){
  picked=[lat,lng];
  if(pickMarker) pickMarker.setLatLng(picked);
  else{
    pickMarker=L.marker(picked,{draggable:true}).addTo(map)
      .bindTooltip('จุดที่เลือก — ลากเพื่อปรับ',{permanent:true,direction:'top'}).openTooltip();
    pickMarker.on('dragend',ev=>{const p=ev.target.getLatLng();picked=[p.lat,p.lng];syncHidden();detectArea();});
  }
  syncHidden();
  detectArea();
}
function syncHidden(){
  if($('#sheetPoint').classList.contains('show')&&picked){
    $('#fPoint').lat.value=picked[0]; $('#fPoint').lng.value=picked[1];
    $('#coordBox').innerHTML='📍 <b>พิกัด</b><br>Lat: '+picked[0].toFixed(6)+' , Lng: '+picked[1].toFixed(6);
  }
}

function icon(t){
  const s=TYPES[t]||TYPES['อื่นๆ'];
  return L.divIcon({className:'',iconSize:[34,34],iconAnchor:[17,32],popupAnchor:[0,-28],
    html:'<div class="pin" style="background:'+s.c+'"><i>'+s.i+'</i></div>'});
}

async function fetchAndAddMarker(id){
  try{const res=await fetch('/api/points/'+id);if(res.ok)addMarkerToMap(await res.json())}catch(e){}
}

function addMarkerToMap(p){
  if(markers[p.id]) cluster.removeLayer(markers[p.id]);
  if((filt.amphoe&&p.amphoe!==filt.amphoe)||(filt.tambon&&p.tambon!==filt.tambon)){delete markers[p.id];return;}
  if(p.status==='rejected'&&p.reporterId!==me.id){delete markers[p.id];return;}
  const t=p.caseType==='อื่นๆ'?(p.caseTypeOther||'อื่นๆ'):p.caseType;
  const own=p.reporterId===me.id&&p.status==='pending';
  const m=L.marker([p.lat,p.lng],{icon:icon(p.caseType),draggable:own});
  if(own) m.on('dragend',async ev=>{
    const ll=ev.target.getLatLng();
    const r=await fetch('/api/points/'+p.id+'/location',{method:'PUT',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({lat:ll.lat,lng:ll.lng})});
    const d=await r.json();
    if(!r.ok){toast(d.error,'err');loadPoints();return;}
    toast(d.warning?'⚠️ '+d.warning:'✅ ย้ายหมุดแล้ว: ต.'+(d.point.tambon||'-'),d.warning?'err':'ok');
  });
  m.bindPopup('<div class="pop"><h4>'+esc(p.caseName)+'</h4>'+
    '<p>🏷️ '+esc(t)+'</p><p>📞 '+esc(p.caretakerPhone||'-')+'</p>'+
    '<p>🗺️ '+areaTxt(p)+'</p>'+
    '<p>👤 '+esc(p.reporter.name)+'</p>'+
    '<span class="badge b-'+p.status+'">'+label(p.status)+'</span>'+
    '<button class="btn sm" style="margin-top:10px;width:100%" onclick="detail('+p.id+')">ดูรายละเอียด</button></div>');
  m.bindTooltip(p.caseName,{direction:'top',offset:[0,-28]});
  markers[p.id]=m; cluster.addLayer(m); updateCount();
}
const updateCount=()=>$('#chipCount').textContent='🗺️ '+Object.keys(markers).length+' จุด';

async function loadPoints(fit){
  const q=new URLSearchParams();
  if(filt.amphoe)q.set('amphoe',filt.amphoe); if(filt.tambon)q.set('tambon',filt.tambon);
  const d=await (await fetch('/api/points?'+q)).json();
  cluster.clearLayers(); markers={}; d.forEach(addMarkerToMap); updateCount();
  if(fit&&d.length) map.fitBounds(L.latLngBounds(d.map(p=>[p.lat,p.lng])),{padding:[40,40],maxZoom:16});
}

function initSocket(){
  const s=io();
  s.on('point:update-hint',d=>fetchAndAddMarker(d.id));
  s.on('point:removed',d=>{if(markers[d.id]){cluster.removeLayer(markers[d.id]);delete markers[d.id];updateCount();}});
  s.on('point:mine',p=>addMarkerToMap(p));
  s.on('user:status',d=>{if(d.status!=='approved'){alert('สถานะบัญชีของคุณถูกเปลี่ยนโดยผู้ดูแลระบบ');location.href='/';}});
}

function renderExistingPhotos(){

/* ============================================================
 * ★ โหมดแก้ไข — admin ทุกเคส / เจ้าของเคสตัวเอง
 * ============================================================ */
async function startEdit(id){
  const r=await fetch('/api/points/'+id);
  if(!r.ok) return toast('โหลดข้อมูลเพื่อแก้ไขไม่สำเร็จ','err');
  const p=await r.json();
  close('#sheetDetail');
  editId=id; removedPhotoIds=[]; areaTouched=false;
  existingPhotos=(p.photos||[]).map(u=>u.split('/').pop());

  const f=$('#fPoint');
  f.lat.value=p.lat; f.lng.value=p.lng; f.accuracy.value=p.accuracy??'';
  f.case_name.value=p.caseName||''; f.case_type.value=p.caseType||'';
  const isOther=p.caseType==='อื่นๆ';
  $('#ctOther').style.display=isOther?'':'none'; $('#ctOther input').required=isOther;
  f.case_type_other.value=p.caseTypeOther||'';
  f.caretaker_name.value=p.caretakerName||'';
  f.caretaker_phone.value=p.caretakerPhone||'';
  f.address.value=p.address||'';
  f.note.value=p.note||'';
  f.moo.value=p.moo||'';
  fillTam($('#selTam'),p.amphoe||'','— ตำบล —');
  $('#selAmp').value=p.amphoe||''; $('#selTam').value=p.tambon||'';
  $('#areaNote').textContent='พื้นที่เดิม: อ.'+(p.amphoe||'-')+' ต.'+(p.tambon||'-')+' — ลากหมุดเพื่อย้ายจุด (ระบบจะตรวจตำบลใหม่ให้อัตโนมัติ)';
  $('#coordBox').innerHTML='📍 <b>พิกัดเดิม</b><br>Lat: '+p.lat.toFixed(6)+' , Lng: '+p.lng.toFixed(6);
  renderExistingPhotos(); $('#prev').innerHTML='';
  f.photos.value='';

  setPick(p.lat,p.lng);                        // วางหมุดที่ตำแหน่งเดิม (ลากย้ายได้ → ตรวจตำบลใหม่ทันที)
  $('#pointTitle').textContent='✏️ แก้ไขพิกัดเคส #'+id;
  $('#savePoint').textContent='💾 บันทึกการแก้ไข';
  open('#sheetPoint');
  if(me.role!=='admin'&&p.status==='approved')
    toast('ℹ️ เคสนี้อนุมัติแล้ว — บันทึกแก้ไขจะส่งกลับไปรอผู้ดูแลตรวจใหม่','err');
}

/* ★ รีเซ็ตฟอร์มกลับสู่โหมดสร้าง */
function resetPointForm(){
  editId=null; removedPhotoIds=[]; existingPhotos=[]; areaTouched=false;
  const f=$('#fPoint'); f.reset();
  $('#prev').innerHTML=''; $('#existPrev').innerHTML='';
  $('#existField').style.display='none';
  $('#ctOther').style.display='none'; $('#ctOther input').required=false;
  $('#pointTitle').textContent='📌 บันทึกพิกัดเคสใหม่';
  $('#savePoint').textContent='💾 บันทึกพิกัด';
  $('#areaNote').textContent=''; $('#coordBox').innerHTML='';
  if(pickMarker){map.removeLayer(pickMarker);pickMarker=null;picked=null;}
}

/* ============================================================
 * SUBMIT — สร้างใหม่ (POST) / แก้ไข (PUT)
 * ============================================================ */
 $('#fPoint').onsubmit=async e=>{
  e.preventDefault();
  const btn=$('#savePoint'); btn.disabled=true;
  btn.textContent=editId?'กำลังบันทึกการแก้ไข...':'กำลังบันทึก...';
  try{
    const fd=new FormData(e.target);
    if(editId){
      if(removedPhotoIds.length) fd.append('removePhotos',JSON.stringify(removedPhotoIds));
      const r=await fetch('/api/points/'+editId,{method:'PUT',body:fd});
      const d=await r.json();
      if(!r.ok){toast(d.error,'err');return;}
      close('#sheetPoint'); resetPointForm();
      addMarkerToMap(d.point);
      toast('✅ '+(d.message||'แก้ไขสำเร็จ'));
      if(d.statusChanged) setTimeout(()=>toast('⏳ เคสถูกส่งกลับไปรอผู้ดูแลอนุมัติ','err'),3400);
    }else{
      const r=await fetch('/api/points',{method:'POST',body:fd});
      const d=await r.json();
      if(!r.ok){toast(d.error,'err');return;}
      close('#sheetPoint'); resetPointForm();
      addMarkerToMap(d.point);
      toast('✅ บันทึกพิกัดสำเร็จ! รอผู้ดูแลระบบอนุมัติ');if(d.warning)setTimeout(()=>toast('⚠️ '+d.warning,'err'),3400);
    }
  }catch(err){toast('บันทึกไม่สำเร็จ ตรวจสอบการเชื่อมต่อ','err');}
  finally{btn.disabled=false;btn.textContent=editId?'💾 บันทึกการแก้ไข':'💾 บันทึกพิกัด';}
};

/* ★ ลบพิกัด */
async function deletePoint(id){
  if(!confirm('ยืนยันการลบพิกัดนี้? การลบไม่สามารถย้อนกลับได้')) return;
  const r=await fetch('/api/points/'+id,{method:'DELETE'});
  const d=await r.json();
  if(!r.ok) return toast(d.error,'err');
  close('#sheetDetail');
  if(markers[id]){cluster.removeLayer(markers[id]);delete markers[id];updateCount();}
  toast('🗑️ ลบพิกัดสำเร็จ');
}

 $('#logout').onclick=async()=>{await fetch('/api/logout',{method:'POST'});location.href='/'};
</script>
<script>
/*SCALE-PATCH*/
(()=>{
const st=document.createElement('style');
st.textContent='.clb{border-radius:50%;background:rgba(31,111,235,.88);color:#fff;text-align:center;font:700 13px system-ui,sans-serif;border:3px solid rgba(255,255,255,.92);box-shadow:0 2px 8px rgba(0,0,0,.3);box-sizing:border-box}';
document.head.appendChild(st);

let vLayer=null,ctl=null,tmr=null,wired=false,mineDone=false;
const nice=n=>n>=1e4?Math.round(n/1e3)+'k':n>=1e3?(n/1e3).toFixed(1)+'k':String(n);
const clIcon=n=>{const s=n>=1e4?60:n>=1e3?52:n>=100?44:n>1?38:26;
  return L.divIcon({className:'',iconSize:[s,s],html:'<div class="clb" style="width:'+s+'px;height:'+s+'px;line-height:'+(s-6)+'px">'+(n>1?nice(n):'')+'</div>'})};
const later=ms=>{clearTimeout(tmr);tmr=setTimeout(()=>loadPoints(),ms)};

function fitFilter(){            // กรองอำเภอ/ตำบล → ซูมไปที่เขตนั้น
  if(!boundary) return false;
  let b=null;
  boundary.eachLayer(l=>{
    const pr=(l.feature&&l.feature.properties)||{};
    const t=stripPrefix(pick(pr,PK)),a=stripPrefix(pick(pr,AK));
    const ok=filt.tambon?(t===filt.tambon&&(!filt.amphoe||a===filt.amphoe)):(a===filt.amphoe);
    if(ok){const lb=l.getBounds();b=b?b.extend(lb):L.latLngBounds(lb.getSouthWest(),lb.getNorthEast())}
  });
  if(b){map.fitBounds(b,{padding:[30,30]});return true}
  return false;
}

/* โหลดเฉพาะสิ่งที่อยู่ในกรอบจอ: ซูมไกล = กลุ่มนับจำนวน (SQL), ซูม ≥16 = หมุดจริง */
loadPoints=async function(fit){
  if(!map) return;
  if(!vLayer) vLayer=L.layerGroup().addTo(map);
  if(!wired){wired=true;map.on('moveend',()=>later(250));setInterval(()=>{if(!document.hidden)loadPoints()},60000)}
  if(!mineDone&&me){mineDone=true;loadMine()}
  if(fit&&(filt.amphoe||filt.tambon)&&fitFilter()) return;   // fitBounds จะทำให้ moveend โหลดต่อเอง

  ctl&&ctl.abort(); ctl=new AbortController();
  const b=map.getBounds().pad(.15);
  const q=new URLSearchParams({zoom:map.getZoom(),bbox:[b.getWest(),b.getSouth(),b.getEast(),b.getNorth()].join(',')});
  if(filt.amphoe)q.set('amphoe',filt.amphoe);
  if(filt.tambon)q.set('tambon',filt.tambon);
  let d;
  try{const r=await fetch('/api/points/clusters?'+q,{signal:ctl.signal});if(!r.ok)return;d=await r.json()}
  catch(e){return}

  vLayer.clearLayers(); let total=0;
  if(d.mode==='points'){
    d.items.forEach(i=>{total++;
      vLayer.addLayer(L.marker([i.lat,i.lng],{icon:icon(i.caseType)}).on('click',()=>detail(i.id))
        .bindTooltip(i.caseName,{direction:'top',offset:[0,-28]}));});
  }else{
    d.items.forEach(c=>{total+=c.n;
      const m=L.marker([c.lat,c.lng],{icon:clIcon(c.n)});
      m.on('click',()=>{
        if(c.n===1) return detail(c.id);
        if(c.minLat===c.maxLat&&c.minLng===c.maxLng) return map.setView([c.lat,c.lng],17);
        map.fitBounds([[c.minLat,c.minLng],[c.maxLat,c.maxLng]],{padding:[50,50],maxZoom:17});
      });
      vLayer.addLayer(m);});
  }
  $('#chipCount').textContent='🗺️ '+total.toLocaleString('th-TH')+' จุดในมุมมอง'+(d.mode==='clusters'&&d.count>=1000?'+':'');
};

/* เคสของตัวเองที่ยังไม่อนุมัติ/ถูกปฏิเสธ → แสดงแยก (ลากย้ายได้เหมือนเดิม) */
const _add=addMarkerToMap;
async function loadMine(){
  try{const r=await fetch('/api/points?mine=1&limit=300');if(!r.ok)return;
    (await r.json()).filter(p=>p.status!=='approved').forEach(_add)}catch(e){}
}
addMarkerToMap=function(p){
  if(p.status==='approved'){                       // เคสอนุมัติแล้วให้มาจากชั้น cluster เท่านั้น
    if(markers[p.id]){cluster.removeLayer(markers[p.id]);delete markers[p.id]}
    return later(400);
  }
  _add(p);
};
fetchAndAddMarker=async function(){later(500)};    // มีเคสใหม่อนุมัติ → รีเฟรชมุมมอง ไม่โหลดทีละจุด
})();

</script></body></html>
